[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qvex"
version = "0.1.0"
description = "Quantum Vacuum Exchange Engine research scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
scripts = [
    "matplotlib",
    "networkx",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["qvex*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
